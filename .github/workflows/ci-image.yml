---
name: CI Base Image

"on":
  push:
    branches: [master]
    paths:
      - docker/ci/Dockerfile
      - .github/workflows/ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/suckless-vulkan-ci:latest
            ghcr.io/${{ github.repository_owner }}/suckless-vulkan-ci:${{
              github.sha
              }}
