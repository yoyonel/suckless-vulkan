---
name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve CI image (GHCR or local fallback)
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE="$REGISTRY/suckless-vulkan-ci:latest"
          if docker pull "$IMAGE"; then
            echo "CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            docker build -t local/suckless-vulkan-ci:latest \
              -f docker/ci/Dockerfile .
            echo "CI_IMAGE=local/suckless-vulkan-ci:latest" >> "$GITHUB_ENV"
          fi

      - name: Run lint inside CI container
        run: |
          docker run --rm \
            -e CI=true \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$CI_IMAGE" \
            bash -lc "just lint"

  build-and-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve CI image (GHCR or local fallback)
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE="$REGISTRY/suckless-vulkan-ci:latest"
          if docker pull "$IMAGE"; then
            echo "CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            docker build -t local/suckless-vulkan-ci:latest \
              -f docker/ci/Dockerfile .
            echo "CI_IMAGE=local/suckless-vulkan-ci:latest" >> "$GITHUB_ENV"
          fi

      - name: Build and test inside CI container (${{ matrix.build_type }})
        run: |
          docker run --rm \
            -e CI=true \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$CI_IMAGE" \
            bash -lc "chmod +x scripts/ci/run_ci_build_and_test.sh && \
              scripts/ci/run_ci_build_and_test.sh ${{ matrix.build_type }}"

      - name: Upload test frame artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-frame-${{ matrix.build_type }}
          path: test_output.png
          if-no-files-found: ignore
