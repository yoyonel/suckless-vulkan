---
name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: docker/ci/Dockerfile
          config: .hadolint.yaml

      - name: Lint GitHub Actions workflows (actionlint)
        uses: rhysd/actionlint@v1.7.4

  lint:
    needs: static-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI image (GHCR or local fallback)
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE="$REGISTRY/suckless-vulkan-ci:latest"
          if docker pull "$IMAGE"; then
            echo "CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            docker build --network=host -t local/suckless-vulkan-ci:latest \
              -f docker/ci/Dockerfile .
            echo "CI_IMAGE=local/suckless-vulkan-ci:latest" >> "$GITHUB_ENV"
          fi

      - name: Run lint inside CI container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$CI_IMAGE" \
            bash -lc "just lint"

  build-and-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI image (GHCR or local fallback)
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE="$REGISTRY/suckless-vulkan-ci:latest"
          if docker pull "$IMAGE"; then
            echo "CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            docker build --network=host -t local/suckless-vulkan-ci:latest \
              -f docker/ci/Dockerfile .
            echo "CI_IMAGE=local/suckless-vulkan-ci:latest" >> "$GITHUB_ENV"
          fi

      - name: Build and test inside CI container (${{ matrix.build_type }})
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$CI_IMAGE" \
            bash -lc "chmod +x scripts/ci/run_ci_build_and_test.sh && \
              scripts/ci/run_ci_build_and_test.sh ${{ matrix.build_type }}"

      - name: Upload test frames artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-frames-${{ matrix.build_type }}
          path: test_*.png
          if-no-files-found: ignore

  memory-checks-asan:
    needs: static-checks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI image (GHCR or local fallback)
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE="$REGISTRY/suckless-vulkan-ci:latest"
          if docker pull "$IMAGE"; then
            echo "CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            docker build --network=host -t local/suckless-vulkan-ci:latest \
              -f docker/ci/Dockerfile .
            echo "CI_IMAGE=local/suckless-vulkan-ci:latest" >> "$GITHUB_ENV"
          fi

      - name: Test with AddressSanitizer (ASan/UBSan)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$CI_IMAGE" \
            bash -lc "chmod +x scripts/ci/run_ci_asan.sh && \
              scripts/ci/run_ci_asan.sh"

  memory-checks-validation-layers:
    needs: static-checks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI image (GHCR or local fallback)
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE="$REGISTRY/suckless-vulkan-ci:latest"
          if docker pull "$IMAGE"; then
            echo "CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            docker build --network=host -t local/suckless-vulkan-ci:latest \
              -f docker/ci/Dockerfile .
            echo "CI_IMAGE=local/suckless-vulkan-ci:latest" >> "$GITHUB_ENV"
          fi

      - name: Test with Vulkan Validation Layers
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$CI_IMAGE" \
            bash -lc "just test-validation-layers"

  coverage:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve CI image (GHCR or local fallback)
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE="$REGISTRY/suckless-vulkan-ci:latest"
          if docker pull "$IMAGE"; then
            echo "CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            docker build --network=host -t local/suckless-vulkan-ci:latest \
              -f docker/ci/Dockerfile .
            echo "CI_IMAGE=local/suckless-vulkan-ci:latest" >> "$GITHUB_ENV"
          fi

      - name: Build tests and generate LLVM coverage report
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$CI_IMAGE" \
            bash -lc "just coverage"

      - name: Upload LLVM coverage HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-html
          path: build/coverage/coverage_report/
          if-no-files-found: error
