---
repos:
  - repo: local
    hooks:
      - id: format-owner-files
        name: Format owner files
        entry: just format
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-owner-files-fast
        name: Lint owner files (fast)
        entry: just lint-fast
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-and-test-before-push
        name: Lint and test before push
        entry: bash -lc 'just lint && just test'
        language: system
        pass_filenames: false
        stages: [pre-push]
